services:
  - type: web
    name: yt-auto
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: YTDLP_PATH
        value: yt-dlp
      - key: YTDLP_JS_RUNTIME
        value: node:/usr/local/bin/node
      - key: YTDLP_COOKIES_PATH
        value: ./cookies.txt
      - key: YTDLP_VERBOSE
        value: false
      - key: YOUTUBE_PRIVACY_STATUS
        value: private
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: SHORT_START
        value: 00:01:00
      - key: SHORT_DURATION
        value: 45
      - key: SHORT_WIDTH
        value: 720
      - key: SHORT_HEIGHT
        value: 1280
      - key: RENDER_TIMEOUT_MS
        value: 600000
      - key: UPLOAD_CHUNK_SIZE
        value: 8388608
      - key: UPLOAD_TIMEOUT_MS
        value: 600000
      - key: MAX_SOURCE_DURATION_SECONDS
        value: 7200
